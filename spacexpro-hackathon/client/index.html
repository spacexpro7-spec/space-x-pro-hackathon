<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#030304" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="dark" />
    <!-- Empty inline icon: stops the browser fetching /favicon.ico, which
         lives outside the space's routes and fails auth. -->
    <link rel="icon" href="data:," />
    <title>SPACExPRO Hackathon</title>
    <!-- Fonts load asynchronously (preload-as-style + onload swap, with
         display=swap): a slow or failed font fetch can never block the
         page or trap the preloader, whose CSS-only kill-switch remains
         the backstop. If the webfonts never arrive, the system sans
         fallbacks in theme.css carry the same design. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" /></noscript>
    <script src="./src/main.tsx" type="module"></script>
  </head>
  <body>
    <div
      data-generated-space-root=""
      data-generated-space-slug="orbitx-hackathon"
    ></div>
  </body>
</html>
